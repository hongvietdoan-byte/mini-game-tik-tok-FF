name: CI

on:
  # Người dùng không muốn mail báo lỗi (12/11): chỉ chạy CI khi push main hoặc bấm tay.
  # Nhánh codex1/codex2 do coordinator chạy test cục bộ trước khi gộp.
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "fixtures/assets-placeholder/**"
      - "scripts/privacy-check.*"
      - "playwright.config.ts"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  verify:
    # Dự án dùng better-sqlite3; chạy trên Windows khớp môi trường phát triển và đích triển khai.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cài Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Bật Corepack
        run: corepack enable

      - name: Cài dependencies
        run: pnpm install --frozen-lockfile

      - name: Kiểm tra quyền riêng tư
        run: pnpm privacy:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Cài Chromium cho Playwright
        run: pnpm exec playwright install chromium

      - name: E2E overlay với asset giữ chỗ
        env:
          QUIZ_ASSETS_DIR: ${{ github.workspace }}/fixtures/assets-placeholder
        run: pnpm test:e2e
